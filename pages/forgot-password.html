<!DOCTYPE html>
<!--
  ============================================================
   FILE: pages/forgot-password.html
   QUÊN MẬT KHẨU – luôn trả lời chung chung để không lộ email nào đã đăng ký.
   Cấu trúc chung mọi trang: [#site-header] đầu trang → [#main] nội dung → [#site-footer] chân trang.
   Đầu/chân trang được vẽ bởi js/components/layout.js; logic riêng của trang nằm ở forgot-password.js.
  ============================================================
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu – Bàn Tay Vang</title>
  <meta name="description" content="Nhận liên kết đặt lại mật khẩu qua email.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Phông chữ: Be Vietnam Pro (nội dung) + Lora (tiêu đề) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <!-- CSS: nền tảng → khung → thành phần → riêng từng trang -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
  <!-- Liên kết nhảy tới nội dung chính (hỗ trợ bàn phím / trình đọc màn hình) -->
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <!-- Đầu trang: logo, tìm kiếm, giỏ hàng, tài khoản (do layout.js vẽ) -->
  <div id="site-header"></div>

  <!-- Nội dung riêng của trang -->
  <main id="main">

    <div class="container form-narrow">
      <div class="card auth-card">
        <h1>Quên mật khẩu</h1>
        <form id="forgot-form" novalidate>
          <p class="muted">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu (có hạn dùng ngắn).</p>
          <div class="alert alert-error form-alert" hidden role="alert"></div>
          <div class="field"><label for="email">Email <span class="req">*</span></label><input id="email" type="email" autocomplete="email" maxlength="120"><p class="field-error" role="alert"></p></div>
          <div class="field" id="captcha"></div>
          <button id="submit-btn" class="btn btn-primary btn-lg btn-block" type="submit">Gửi liên kết</button>
        </form>
        <div id="done" hidden><div class="alert alert-success" id="done-msg" role="status"></div><div id="demo-mailbox" class="alert alert-info" hidden></div></div>
        <p class="center"><a href="login.html">← Về đăng nhập</a></p>
      </div>
    </div>

  </main>

  <!-- Chân trang (do layout.js vẽ) -->
  <div id="site-footer"></div>

  <!-- Mã JS của trang (ES module: chạy sau khi HTML tải xong) -->
  <script type="module" src="../js/pages/forgot-password.js"></script>
</body>
</html>
