<!DOCTYPE html>
<!--
  ============================================================
   FILE: pages/orders.html
   ĐƠN MUA – các thẻ trạng thái, tìm kiếm, lọc theo ngày.
   Cấu trúc chung mọi trang: [#site-header] đầu trang → [#main] nội dung → [#site-footer] chân trang.
   Đầu/chân trang được vẽ bởi js/components/layout.js; logic riêng của trang nằm ở orders.js.
  ============================================================
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn mua – Bàn Tay Vang</title>
  <meta name="description" content="Theo dõi các đơn hàng đã đặt.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Phông chữ: Be Vietnam Pro (nội dung) + Lora (tiêu đề) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <!-- CSS: nền tảng → khung → thành phần → riêng từng trang -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/orders.css">
</head>
<body>
  <!-- Liên kết nhảy tới nội dung chính (hỗ trợ bàn phím / trình đọc màn hình) -->
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <!-- Đầu trang: logo, tìm kiếm, giỏ hàng, tài khoản (do layout.js vẽ) -->
  <div id="site-header"></div>

  <!-- Nội dung riêng của trang -->
  <main id="main">

    <div class="container">
      <h1 class="page-title">Đơn mua của tôi</h1>
      <div class="card filter-bar">
        <div class="field"><label for="q">Tìm đơn</label><input id="q" type="search" placeholder="Mã đơn, tên sản phẩm hoặc gian hàng"></div>
        <div class="field"><label for="from">Từ ngày</label><input id="from" type="date"></div>
        <div class="field"><label for="to">Đến ngày</label><input id="to" type="date"></div>
      </div>
      <p id="date-err" class="field-error" role="alert"></p>
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="list"></div>
    </div>

  </main>

  <!-- Chân trang (do layout.js vẽ) -->
  <div id="site-footer"></div>

  <!-- Mã JS của trang (ES module: chạy sau khi HTML tải xong) -->
  <script type="module" src="../js/pages/orders.js"></script>
</body>
</html>
