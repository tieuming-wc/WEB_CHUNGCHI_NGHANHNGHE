<!DOCTYPE html>
<!--
  ============================================================
   FILE: pages/change-password.html
   ĐỔI MẬT KHẨU – cần mật khẩu cũ, kiểm tra độ mạnh mật khẩu mới.
   Cấu trúc chung mọi trang: [#site-header] đầu trang → [#main] nội dung → [#site-footer] chân trang.
   Đầu/chân trang được vẽ bởi js/components/layout.js; logic riêng của trang nằm ở change-password.js.
  ============================================================
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đổi mật khẩu – Bàn Tay Vang</title>
  <meta name="description" content="Đổi mật khẩu tài khoản.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Phông chữ: Be Vietnam Pro (nội dung) + Lora (tiêu đề) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <!-- CSS: nền tảng → khung → thành phần → riêng từng trang -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
  <!-- Liên kết nhảy tới nội dung chính (hỗ trợ bàn phím / trình đọc màn hình) -->
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <!-- Đầu trang: logo, tìm kiếm, giỏ hàng, tài khoản (do layout.js vẽ) -->
  <div id="site-header"></div>

  <!-- Nội dung riêng của trang -->
  <main id="main">

    <div class="container form-narrow">
      <div class="card auth-card">
        <h1>Đổi mật khẩu</h1>
        <form id="pw-form" novalidate>
          <div class="alert alert-error form-alert" hidden role="alert"></div>
          <div class="field">
          <label for="old">Mật khẩu hiện tại <span class="req">*</span></label>
          <div class="input-group"><input id="old" name="old" type="password" autocomplete="current-password"><button type="button" class="toggle" data-toggle-password="#old" aria-label="Hiện mật khẩu">Hiện</button></div>
          
          <p class="field-error" role="alert"></p>
        </div>
          <div class="field">
          <label for="new">Mật khẩu mới <span class="req">*</span></label>
          <div class="input-group"><input id="new" name="new" type="password" autocomplete="new-password"><button type="button" class="toggle" data-toggle-password="#new" aria-label="Hiện mật khẩu">Hiện</button></div>
          <p class="field-hint">8–64 ký tự, khác mật khẩu cũ.</p><div class="pw-meter" id="pw-meter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <p class="pw-label" id="pw-label" aria-live="polite"></p>
          <p class="field-error" role="alert"></p>
        </div>
          <div class="field">
          <label for="new2">Nhập lại mật khẩu mới <span class="req">*</span></label>
          <div class="input-group"><input id="new2" name="new2" type="password" autocomplete="new-password"><button type="button" class="toggle" data-toggle-password="#new2" aria-label="Hiện mật khẩu">Hiện</button></div>
          
          <p class="field-error" role="alert"></p>
        </div>
          <button id="save-btn" class="btn btn-primary btn-lg" type="submit">Đổi mật khẩu</button>
        </form>
      </div>
    </div>

  </main>

  <!-- Chân trang (do layout.js vẽ) -->
  <div id="site-footer"></div>

  <!-- Mã JS của trang (ES module: chạy sau khi HTML tải xong) -->
  <script type="module" src="../js/pages/change-password.js"></script>
</body>
</html>
