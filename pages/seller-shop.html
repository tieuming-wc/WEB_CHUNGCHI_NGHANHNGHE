<!DOCTYPE html>
<!--
  ============================================================
   FILE: pages/seller-shop.html
   KÊNH NGƯỜI BÁN › THÔNG TIN GIAN HÀNG.
   Cấu trúc chung mọi trang: [#site-header] đầu trang → [#main] nội dung → [#site-footer] chân trang.
   Đầu/chân trang được vẽ bởi js/components/layout.js; logic riêng của trang nằm ở seller-shop.js.
  ============================================================
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin gian hàng – Kênh người bán</title>
  <meta name="description" content="Cập nhật thông tin gian hàng.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Phông chữ: Be Vietnam Pro (nội dung) + Lora (tiêu đề) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <!-- CSS: nền tảng → khung → thành phần → riêng từng trang -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/seller.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
  <!-- Liên kết nhảy tới nội dung chính (hỗ trợ bàn phím / trình đọc màn hình) -->
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <!-- Đầu trang: logo, tìm kiếm, giỏ hàng, tài khoản (do layout.js vẽ) -->
  <div id="site-header"></div>

  <!-- Nội dung riêng của trang -->
  <div class="container seller-shell">
    <aside id="seller-menu" class="seller-menu" aria-label="Menu người bán"></aside>
    <section id="main" class="seller-content">

      <h1 class="page-title">Thông tin gian hàng</h1>
      <form id="shop-form" class="card" novalidate>
        <div class="field"><label for="name">Tên gian hàng <span class="req">*</span></label><input id="name" type="text" maxlength="60"><p class="field-error" role="alert"></p></div>
        <div class="field"><label for="village">Làng nghề</label><select id="village"></select></div>
        <div class="field"><label for="artisan">Tên nghệ nhân / cơ sở</label><input id="artisan" type="text" maxlength="80"><p class="field-error" role="alert"></p></div>
        <div class="field"><label for="story">Câu chuyện gian hàng</label><textarea id="story" rows="5" maxlength="1500"></textarea><p class="field-error" role="alert"></p></div>
        <div class="field"><label for="address">Địa chỉ gửi hàng</label><input id="address" type="text" maxlength="200"></div>
        <div class="field"><label for="phone">Số điện thoại gian hàng</label><input id="phone" type="tel" maxlength="15"></div>
        <button id="save-btn" class="btn btn-primary btn-lg" type="submit">Lưu thông tin</button>
      </form>
      <!-- [BTV-ADMIN] Minh chứng riêng tư, không hiển thị trên trang gian hàng công khai -->
      <section class="card" id="verify-card" style="margin-top:20px">
        <h2>🛡️ Xác minh gian hàng</h2>
        <p id="verify-status" class="muted">Đang tải trạng thái…</p>
        <form id="verify-form">
          <div class="field"><label for="proof-type">Loại minh chứng</label>
            <select id="proof-type" required><option value="">Chọn loại minh chứng</option><option>Giấy đăng ký kinh doanh / hộ kinh doanh</option><option>Xác nhận hợp tác xã hoặc làng nghề</option><option>Hồ sơ nghệ nhân, sản phẩm và xưởng thực tế</option><option>Giấy tờ khác phù hợp</option></select></div>
          <div class="field"><label for="proof-note">Mô tả minh chứng và thông tin đối chiếu</label>
            <textarea id="proof-note" rows="4" maxlength="800" required placeholder="Mô tả cơ sở, địa điểm sản xuất, phương thức liên hệ xác minh..."></textarea></div>
          <div class="field"><label for="proof-link">Đường dẫn minh chứng (tùy chọn)</label>
            <input id="proof-link" type="url" placeholder="https://..." maxlength="500">
            <p class="small muted">Chỉ chia sẻ tài liệu mà bạn có quyền cung cấp. Không nhập số CCCD, ảnh giấy tờ định danh hay thông tin nhạy cảm vào ô này.</p></div>
          <button class="btn btn-primary" type="submit" id="verify-submit">Gửi yêu cầu xác minh</button>
        </form>
      </section>

    </section>
  </div>

  <!-- Chân trang (do layout.js vẽ) -->
  <div id="site-footer"></div>

  <!-- Mã JS của trang (ES module: chạy sau khi HTML tải xong) -->
  <script type="module" src="../js/pages/seller-shop.js"></script>
</body>
</html>
