<!DOCTYPE html>
<!--
  ============================================================
   FILE: admin/operations.html
   QUẢN TRỊ – chỉ tài khoản có role = admin.
   Cấu trúc chung mọi trang: [#site-header] đầu trang → [#main] nội dung → [#site-footer] chân trang.
   Đầu/chân trang được vẽ bởi js/components/layout.js; logic riêng của trang nằm ở admin/js/admin-operations.js.
  ============================================================
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị – Bàn Tay Vang</title>
  <meta name="description" content="Xác nhận thanh toán, vận chuyển, chứng nhận và chấm bài.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Phông chữ: Be Vietnam Pro (nội dung) + Lora (tiêu đề) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <!-- CSS: nền tảng → khung → thành phần → riêng từng trang -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/orders.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Liên kết nhảy tới nội dung chính (hỗ trợ bàn phím / trình đọc màn hình) -->
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <!-- Đầu trang: logo, tìm kiếm, giỏ hàng, tài khoản (do layout.js vẽ) -->
  <div id="site-header"></div>

  <!-- Nội dung riêng của trang -->
  <main id="main">

    <div class="container">
      <h1 class="page-title">Nghiệp vụ quản trị cũ</h1>
      <p class="muted">Quản trị viên xác nhận các sự kiện mà website chưa kết nối hệ thống thật (cổng thanh toán, hãng vận chuyển, hội đồng đánh giá).</p>
      <div id="tabs" class="tabs"></div>
      <div id="view"></div>
    </div>

  </main>

  <!-- Chân trang (do layout.js vẽ) -->
  <div id="site-footer"></div>

  <!-- Mã JS của trang (ES module: chạy sau khi HTML tải xong) -->
  <script type="module" src="js/admin-operations.js"></script>
</body>
</html>
